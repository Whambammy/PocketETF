<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCustom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#172a45" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#9945FF" />
    </linearGradient>
    <filter id="glowCustom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGradCustom)" />
  <rect x="10" y="10" width="380" height="380" rx="30" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.4" />

  <!-- Studio Custom Emblem -->
  <circle cx="200" cy="180" r="75" fill="#102038" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glowCustom)" />
  
  <path d="M 170 180 L 230 180 M 200 150 L 200 210" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
  
  <!-- Bottom Badge -->
  <rect x="80" y="325" width="240" height="38" rx="19" fill="#132742" stroke="url(#cyanPurple)" stroke-width="1.5" />
  <text x="200" y="349" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">CUSTOM CREATOR BLINK</text>
</svg>
