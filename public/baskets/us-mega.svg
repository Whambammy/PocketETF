<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a29" />
      <stop offset="50%" stop-color="#2a0e44" />
      <stop offset="100%" stop-color="#0e0419" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowMega" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGradMega)" />
  <rect x="10" y="10" width="380" height="380" rx="30" fill="none" stroke="url(#neonPurple)" stroke-width="2" opacity="0.4" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="190" r="110" fill="none" stroke="url(#neonPurple)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="200" cy="190" r="85" fill="#1e0c33" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glowMega)" />

  <!-- 3 Pillar Icons / Nodes -->
  <!-- Top: Apple -->
  <circle cx="200" cy="120" r="28" fill="#2d124d" stroke="#D946EF" stroke-width="2" />
  <text x="200" y="126" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">AAPL</text>
  <text x="200" y="139" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#D946EF" text-anchor="middle">34%</text>

  <!-- Left: Microsoft -->
  <circle cx="140" cy="225" r="28" fill="#2d124d" stroke="#00A4EF" stroke-width="2" />
  <text x="140" y="231" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">MSFT</text>
  <text x="140" y="244" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#00A4EF" text-anchor="middle">33%</text>

  <!-- Right: Google -->
  <circle cx="260" cy="225" r="28" fill="#2d124d" stroke="#4285F4" stroke-width="2" />
  <text x="260" y="231" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">GOOGL</text>
  <text x="260" y="244" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#4285F4" text-anchor="middle">33%</text>

  <!-- Center Symbol -->
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">TITANS</text>

  <!-- Bottom Badge -->
  <rect x="80" y="325" width="240" height="38" rx="19" fill="#260b40" stroke="url(#neonPurple)" stroke-width="1.5" />
  <text x="200" y="349" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">US MEGA-CAP TITANS</text>
</svg>
