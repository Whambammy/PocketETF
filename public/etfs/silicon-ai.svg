<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSilicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051410" />
      <stop offset="50%" stop-color="#0a251e" />
      <stop offset="100%" stop-color="#020d0a" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgSilicon)" />
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="url(#neonGreen)" stroke-width="1.5" opacity="0.4" />

  <!-- Circuit Traces -->
  <g stroke="#10B981" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 40 80 H 130 V 160" />
    <circle cx="40" cy="80" r="4" fill="#10B981" />
    <path d="M 360 80 H 270 V 160" />
    <circle cx="360" cy="80" r="4" fill="#10B981" />
    <path d="M 40 320 H 130 V 240" />
    <circle cx="40" cy="320" r="4" fill="#10B981" />
    <path d="M 360 320 H 270 V 240" />
    <circle cx="360" cy="320" r="4" fill="#10B981" />
  </g>

  <!-- Central Chip Shield -->
  <rect x="120" y="120" width="160" height="160" rx="24" fill="#0d1b17" stroke="url(#neonGreen)" stroke-width="2.5" filter="url(#glow)" />
  <rect x="135" y="135" width="130" height="130" rx="16" fill="#061f18" stroke="#10B981" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Typography & Tickers (2 Assets) -->
  <text x="200" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#10B981" text-anchor="middle" letter-spacing="1">NVDA 60%</text>
  <text x="200" y="218" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#06B6D4" text-anchor="middle" letter-spacing="1">TSM 40%</text>

  <!-- PocketETF Badge -->
  <rect x="80" y="325" width="240" height="38" rx="19" fill="#0c231c" stroke="url(#neonGreen)" stroke-width="1.5" />
  <text x="200" y="349" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">POCKETETF • SILICON AI</text>
</svg>
