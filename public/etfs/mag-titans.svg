<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a22" />
      <stop offset="50%" stop-color="#230e38" />
      <stop offset="100%" stop-color="#0a0314" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowMag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgMag)" />
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.4" />

  <circle cx="200" cy="180" r="100" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5" />
  <circle cx="200" cy="180" r="80" fill="#1b0a2f" stroke="url(#neonPurple)" stroke-width="2.5" filter="url(#glowMag)" />

  <!-- Left Node: Apple (50%) -->
  <circle cx="150" cy="180" r="38" fill="#2d124d" stroke="#94A3B8" stroke-width="2.5" />
  <text x="150" y="176" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">AAPL</text>
  <text x="150" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#38BDF8" text-anchor="middle">50%</text>

  <!-- Right Node: Microsoft (50%) -->
  <circle cx="250" cy="180" r="38" fill="#2d124d" stroke="#38BDF8" stroke-width="2.5" />
  <text x="250" y="176" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">MSFT</text>
  <text x="250" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#EC4899" text-anchor="middle">50%</text>

  <!-- Connecting Bridge Line -->
  <line x1="188" y1="180" x2="212" y2="180" stroke="url(#neonPurple)" stroke-width="3" stroke-linecap="round" />

  <rect x="70" y="325" width="260" height="38" rx="19" fill="#210a38" stroke="url(#neonPurple)" stroke-width="1.5" />
  <text x="200" y="349" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">POCKETETF • MAG TITANS</text>
</svg>
